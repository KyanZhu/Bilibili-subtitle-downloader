<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilibili Subtitle Downloader</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="header">
          <div>
            <h1>Bilibili 字幕下载</h1>
            <p>每行输入一个视频链接或 BV 号；批量会串行下载，避免一次打开太多请求。</p>
          </div>
          <div class="header-actions">
            <button type="submit" form="download-form" id="download-button">
              <span class="button-icon" aria-hidden="true">↓</span>
              开始下载
            </button>
            <button type="button" class="secondary" id="shutdown-button">停止服务</button>
            <div class="status" id="status">Ready</div>
          </div>
        </header>

        <nav class="tabs" aria-label="下载模式">
          <button type="button" class="tab-button is-active" data-tab="video">视频下载</button>
          <button type="button" class="tab-button" data-tab="uploader">UP 主下载</button>
          <button type="button" class="tab-button" data-tab="subscriptions">订阅更新</button>
        </nav>

        <form class="form is-video-mode" id="download-form">
          <section class="tab-panel is-active" data-panel="video">
            <label class="field">
              <span>视频链接或 BV 号</span>
              <textarea id="video-input" class="video-list" name="video" autocomplete="off" placeholder="https://www.bilibili.com/video/BV...&#10;BV..."></textarea>
            </label>
          </section>

          <section class="tab-panel" data-panel="uploader" hidden>
            <label class="field">
              <span>UP 主名称、ID 或空间链接</span>
              <input id="uploader-input" name="uploader" autocomplete="off" placeholder="三七床车流浪中国 / 1350959407 / https://space.bilibili.com/1350959407">
            </label>
          </section>

          <section class="tab-panel" data-panel="subscriptions" hidden>
            <div class="subscription-group-tools">
              <label class="field">
                <span>当前分组</span>
                <select id="subscription-group-select" name="subscriptionGroupSelect"></select>
              </label>
              <label class="field">
                <span>新建分组</span>
                <input id="subscription-new-group-input" name="subscriptionNewGroup" autocomplete="off" placeholder="股评">
              </label>
              <button type="button" class="secondary" id="add-subscription-group-button">新建分组</button>
              <button type="button" class="secondary danger-button" id="delete-subscription-group-button">删除分组</button>
            </div>
            <div class="subscription-tools">
              <label class="field">
                <span>添加订阅 UP 主</span>
                <textarea id="subscription-input" class="subscription-input" autocomplete="off" placeholder="三七床车流浪中国, 1350959407&#10;https://space.bilibili.com/1350959407"></textarea>
              </label>
              <button type="button" class="secondary" id="add-subscription-button">添加订阅</button>
            </div>
            <div class="subscription-list" id="subscription-list">
              <div class="empty-state">
                <h2>订阅更新</h2>
                <p>还没有订阅 UP 主。</p>
              </div>
            </div>
          </section>

          <div class="date-grid non-video-option" aria-label="发布时间过滤">
            <label class="field">
              <span>开始日期</span>
              <input id="start-date-input" name="startDate" type="date">
            </label>
            <label class="field">
              <span>结束日期</span>
              <input id="end-date-input" name="endDate" type="date">
            </label>
          </div>

          <div class="settings-row">
            <label class="field">
              <span>输出目录</span>
              <span class="input-with-button">
                <input id="output-input" name="output" value="downloads">
                <button type="button" class="secondary icon-button" id="open-output-button" title="打开输出目录" aria-label="打开输出目录">↗</button>
              </span>
            </label>
            <label class="field">
              <span>批量延迟（毫秒）</span>
              <input id="delay-input" name="delay" type="number" min="0" step="100" value="800">
            </label>
          </div>

          <div class="options">
            <label class="check-option">
              <input id="chinese-only-input" type="checkbox">
              <span>只下载中文字幕</span>
            </label>
            <label class="check-option">
              <input id="plain-text-input" type="checkbox">
              <span>同时生成纯文本</span>
            </label>
            <label class="check-option">
              <input id="collect-plain-text-input" type="checkbox">
              <span>汇总本次纯文本</span>
            </label>
            <label class="check-option">
              <input id="rename-by-title-input" type="checkbox">
              <span>文件名使用视频标题</span>
            </label>
            <label class="check-option">
              <input id="audio-fallback-input" type="checkbox">
              <span>无字幕时下载音频</span>
            </label>
            <label class="check-option non-video-option">
              <input id="incremental-update-input" type="checkbox">
              <span>UP 主增量更新</span>
            </label>
            <label class="check-option non-video-option">
              <input id="group-by-date-input" type="checkbox">
              <span>按日期命名</span>
            </label>
          </div>

          <label class="field cookie-field">
            <span>Cookies</span>
            <textarea id="cookie-input" name="cookies" spellcheck="false" rows="3" placeholder="# Netscape HTTP Cookie File&#10;.bilibili.com&#9;TRUE&#9;/&#9;TRUE&#9;...&#9;SESSDATA&#9;..."></textarea>
          </label>
        </form>
      </section>

      <aside class="result-panel">
        <div class="panel-header">
          <h2>结果</h2>
          <div class="result-actions">
            <button type="button" class="secondary detail-toggle" id="detail-toggle" disabled>显示详情</button>
            <button type="button" class="secondary" id="clear-button">
              <span class="button-icon" aria-hidden="true">×</span>
              清空结果
            </button>
            <span id="result-kind">等待任务</span>
          </div>
        </div>
        <div class="result-body">
          <div id="summary-output" class="summary-output">还没有运行下载任务。</div>
          <pre id="result-output" hidden></pre>
        </div>
      </aside>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
